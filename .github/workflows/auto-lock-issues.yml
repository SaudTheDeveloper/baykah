name: Lock new issue conversations
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
jobs:
  lock-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lock conversation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/lock"
